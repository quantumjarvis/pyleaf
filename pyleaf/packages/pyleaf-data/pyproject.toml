[project]
name = "pyleaf-data"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pyleaf-core",
    "pyleaf-tx",
    "pyleaf-starter-sqlalchemy",
    "sqlalchemy>=2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pyleaf"]

[tool.uv.sources]
pyleaf-core = { workspace = true }
pyleaf-tx = { workspace = true }
pyleaf-starter-sqlalchemy = { workspace = true }
