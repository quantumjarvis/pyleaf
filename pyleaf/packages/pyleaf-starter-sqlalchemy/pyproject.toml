[project]
name = "pyleaf-starter-sqlalchemy"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pyleaf-boot",
    "sqlalchemy>=2",
]

[project.entry-points."pyleaf.autoconfigure"]
sqlalchemy = "pyleaf.starter.sqlalchemy.autoconfigure:SqlAlchemyAutoConfiguration"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pyleaf"]

[tool.uv.sources]
pyleaf-boot = { workspace = true }
