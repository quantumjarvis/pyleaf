[project]
name = "pyleaf-test"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pyleaf-boot",
    "pytest>=8",
]

[project.entry-points.pytest11]
pyleaf = "pyleaf.test.plugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pyleaf"]

[tool.uv.sources]
pyleaf-boot = { workspace = true }
