[project]
name = "pyleaf-actuator"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pyleaf-web",
]

[project.optional-dependencies]
prometheus = ["prometheus-client>=0.20"]

[project.entry-points."pyleaf.autoconfigure"]
actuator = "pyleaf.actuator.autoconfigure:ActuatorAutoConfiguration"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pyleaf"]

[tool.uv.sources]
pyleaf-web = { workspace = true }
