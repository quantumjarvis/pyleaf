[project]
name = "pyleaf-boot"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pyleaf-core",
    "pydantic>=2",
    "pydantic-settings>=2",
    "pyyaml>=6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pyleaf"]

[tool.uv.sources]
pyleaf-core = { workspace = true }