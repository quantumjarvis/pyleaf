[project]
name = "pyleaf-web"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pyleaf-boot",
    "fastapi>=0.110",
    "httpx>=0.27",
    "uvicorn>=0.30",
]

[project.entry-points."pyleaf.autoconfigure"]
web = "pyleaf.web.autoconfigure:WebAutoConfiguration"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pyleaf"]

[tool.uv.sources]
pyleaf-boot = { workspace = true }
