[project]
name = "pyleaf-security"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pyleaf-core",
]

# Optional integrations (WI 3.8) — each bean is OnClass-gated, so the
# package works without any of these installed.
[project.optional-dependencies]
jwt = ["pyjwt>=2.8"]
argon2 = ["argon2-cffi>=23"]
bcrypt = ["bcrypt>=4"]
web = ["pyleaf-web"]

[project.entry-points."pyleaf.autoconfigure"]
security = "pyleaf.security.autoconfig:SecurityAutoConfiguration"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pyleaf"]

[tool.uv.sources]
pyleaf-core = { workspace = true }
pyleaf-web = { workspace = true }
