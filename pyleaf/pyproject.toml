[project]
name = "pyleaf-workspace"
version = "0.1.0"
requires-python = ">=3.11"

[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
dev = [
    "pyleaf-core",
    "pyleaf-boot",
    "pyleaf-starter-sqlalchemy",
    "pyleaf-test",
    "pyleaf-web",
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-benchmark>=5",
    "mypy>=1.8",
    "ruff>=0.5",
    "types-PyYAML>=6",
    "pip-audit>=2.10.1",
    "bandit>=1.9.4",
    "pytest-cov>=7.1.0",
    "httpx>=0.27",
    "mutmut>=3.8.0",
    "mkdocs-material>=9",
]

[tool.uv.sources]
pyleaf-core = { workspace = true }
pyleaf-boot = { workspace = true }
pyleaf-starter-sqlalchemy = { workspace = true }
pyleaf-test = { workspace = true }
pyleaf-web = { workspace = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["packages/*/tests"]
addopts = "--import-mode=importlib"

[tool.mypy]
strict = true
# ``pyleaf`` is a PEP 420 namespace package split across packages/*/src;
# map the workspace src trees so ``mypy <pkg>/src`` resolves to
# ``pyleaf.core`` / ``pyleaf.boot`` instead of top-level names.
explicit_package_bases = true
mypy_path = [
    "packages/pyleaf-core/src",
    "packages/pyleaf-boot/src",
    "packages/pyleaf-starter-sqlalchemy/src",
    "packages/pyleaf-test/src",
    "packages/pyleaf-web/src",
]

[tool.coverage.report]
# Gate policy (PYL-19): resolver.py, aop.py, conditions.py and
# autoconfigure.py must each stay >= 90% and TOTAL >= 80%. coverage has no
# global per-file fail-under, so scripts/quality_m1.sh enforces the per-file
# gates via `coverage report --include=... --fail-under=90`.
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "^\\s*\\.\\.\\.$",
]

[tool.ruff]
target-version = "py311"
line-length = 100
# mutants/ is mutmut's generated work tree, not source.
extend-exclude = ["mutants"]

[tool.ruff.lint]
select = [
    "E", "F", "I", "UP", "B", "S", "RUF"
]
[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101"]
"benchmarks/**" = ["S101", "S603"]
