[project]
name = "pyleaf-workspace"
version = "0.1.0"
requires-python = ">=3.11"

[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
dev = [
    "pyleaf-core",
    "pyleaf-boot",
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "mypy>=1.8",
    "ruff>=0.5",
]

[tool.uv.sources]
pyleaf-core = { workspace = true }
pyleaf-boot = { workspace = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["packages/*/tests"]
addopts = "--import-mode=importlib"

[tool.mypy]
strict = true

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E", "F", "I", "UP", "B", "S", "RUF"
]
[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101"]