site_name: pyleaf
site_description: >-
  A Spring-inspired dependency-injection and auto-configuration framework
  for Python: typed DI container, conditions + report, container-applied
  AOP, and starter-based auto-configuration.

theme:
  name: material
  palette:
    - scheme: default
      primary: green
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: green
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Packages:
      - pyleaf-core: packages/core.md
      - pyleaf-boot: packages/boot.md
      - pyleaf-starter-sqlalchemy: packages/starter-sqlalchemy.md
      - pyleaf-test: packages/test.md

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.snippets
  - toc:
      permalink: true
